<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghibli Home Site</title>
    <link rel="stylesheet" href="home.css">
    <script src="app.js" defer></script>
    <script
      src="https://kit.fontawesome.com/9626a8b080.js"
      crossorigin="anonymous">
    </script>
</head>
<body>
    <header class="navbar">
        <nav class="nav__container">
            <div class="sg-logo__wrapper">
                <figure class="sg-logo__crop--container">
                    <img id="sg-logo" src="sgfs-assets/Studio_Ghibli_logo.svg.webp">
                </figure>
                <ul class="nav__link--list">
                    <li class="nav__link">
                        <a href="index.html" class="nav__link--anchor">Home</a>
                    </li>
                    <li class="nav__link">
                        <a href="films.html" class="nav__link--anchor">Find Film</a>
                    </li>
                    <li class="nav__link">
                        <a class=" btn-contact nav__link--anchor">Contact</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="landing__page">
        <div class="content__wrapper">
            <div class="content__box">
                <div>
                    <h1>Best site to find Studio Ghibli films</h1>
                </div>
                <div>
                    <h2>Find your next Ghibli watch!</h2>
                </div>
                <form onsubmit="event.preventDefault()">
                    <input type="search" id="search" placeholder="Search..." oninput="searchFilms(event)">
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
            <div class="sg-img__wrapper">
                <figure class="sg-img__crop--container">
                    <img src="sgfs-assets/9566a20f5d2b1763312495bad233adb8.jpg" class="sg-img">
                </figure>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer__container">
            <div class="row row__column">
                <div class="sg-logo__wrapper">
                    <a href="#">
                        <figure class="sg-logo__crop--container footer__img">
                            <img id="sg-logo" src="sgfs-assets/Studio_Ghibli_logo.svg.webp">
                        </figure>
                    </a>
                    <div class="footer__links--container">
                        <div class="footer__copyright">
                            Copyright &copy; 2026 Film Finder
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
