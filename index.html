<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Ghibli Film Site</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
    <script
      src="https://kit.fontawesome.com/9626a8b080.js"
      crossorigin="anonymous">
    </script>
</head>
<body>
    <section id="landing-page">
        <div class="nav__container"></div>
            <nav>
                <div class="sg-logo__wrapper">
                    <figure class="sg-logo__crop--container">
                        <img id="sg-logo" src="sgfs-assets/Studio_Ghibli_logo.svg.webp">
                    </figure>
                    <ul class="nav__link--list">
                        <li class="nav__link">
                            <a href="#" class="nav__link--anchor">Home</a>
                        </li>
                        <li class="nav__link">
                            <a href="#" class="nav__link--anchor">Find Film</a>
                        </li>
                        <li class="nav__link">
                            <a href="#" class="nav__link--anchor">Contact</a>
                        </li>
                    </ul>
                </div>
                <div class="sort__function"></div>
            </nav>
        </div>
    </section>

    <section id="films">
        <div class="container">
            <div class="row">
                <div class="film-list">
                    <div class="film">
                        <div class="film-card">
                            <div class="film-card__container">
                                <img class="film__img" src="URL_TO_IMAGE" alt="movie banner">
                                <h3>Film Title</h3>
                                <p><b>Original Title:</b> hey</p>
                                <p><b>Description:</b> about here</p>
                                <p><b>Release Year:</b> 0000</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
